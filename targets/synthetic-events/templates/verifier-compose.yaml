# The verifier gets its own database, separate from the agent's.
services:
  main:
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 2s
      timeout: 3s
      retries: 30
