[[hypotheses]]
id = "H1"
text = "Relay 0.49.0 on Haiku no longer halts in its test-first track, where 0.47.0 halted on both M2 pilots, and meets the oracle on most of its runs"

[[hypotheses]]
id = "H2"
text = "Relay on Sonnet costs at least ten times as much as vanilla on Sonnet for the same oracle result"

[[hypotheses]]
id = "H3"
text = "Relay 0.49.0 on Sonnet records fewer deviations from its protocol than 0.47.0, at a similar or higher cost"

[[hypotheses]]
id = "H4"
text = "Opus does not improve on Sonnet's oracle result, and costs more"

[[hypotheses]]
id = "H5"
text = "The quality graders (new static findings, confirmed review findings) differ less between configurations than cost and time do"
