# L-Small, entirely on the GPU. Unsloth and the card disagree on whether it
# thinks by default, so thinking is set explicitly. At 128k the whole model, its
# 8-bit cache and the context fit in 8 GB (peak 7983 MiB); generation slows to
# 22 tokens/s at a full 128k prompt.
[models."qwen3.5-9b-q4_k_m"]
alias = "qwen3.5-9b"
role = "L-Small"
stage = "main"
repo = "unsloth/Qwen3.5-9B-GGUF"
revision = "3885219b6810b007914f3a7950a8d1b469d598a5"
file = "Qwen3.5-9B-Q4_K_M.gguf"
size = 5680522464
sha256 = "03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8"
context = 131072
baseline = "qwen3.5-9b-q4_k_m-20261104T192021Z.json"
# The embedded template raises on a system message that is not first, which Claude Code
# sends (Phase 6, check L3). The override renders it in place; the start refuses a file
# whose SHA-256 differs from this one. L-MoE's embedded template does not raise, so it has none.
chat_template_sha256 = "a4080a6ecb3b1ed244e0a98d028f45c1634225363cb38998375b7d5402889921"
args = [
    "--n-gpu-layers", "999",
    "--chat-template-file", "/templates/qwen3.5-9b-q4_k_m.jinja",
    # Prompt-cache RAM in MiB: the container peaked at about 5.6 GiB of the VM's
    # 17.6 GiB, so 4 GiB fits beside the task container and the others. Check L5
    # revisits it.
    "--cache-ram", "4096",
    "--temp", "0.6", "--top-p", "0.95", "--top-k", "20", "--min-p", "0", "--presence-penalty", "0",
    "--chat-template-kwargs", '{"enable_thinking":true}',
]

