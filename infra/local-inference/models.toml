# Open-weight models and the inference server of the local models plan
# (documentation/plans/local-models.md, D-057, D-058).
#
# The flags are final for Phase 2 (2026-11-04) and recorded in
# documentation/research/local-route.md.
#
# Every weight file is pinned by repository revision and SHA-256, and the server
# image by digest. From harness/, in WSL:
#   uv run python -m atr.local.fetch            download and verify the main stage
#   uv run python -m atr.local.serve start <id> start the server with one model
#   uv run python -m atr.local.bench            measure its speeds and power
#   uv run python -m atr.local.serve stop
# Weights live outside the repository, in $ATR_MODELS_DIR (default /mnt/d/atr/models).
# The main-stage flags were measured in WP0 on 2026-11-04 on the operator's machine
# (RTX 3060 Ti with 8 GB, a WSL 2 VM with 18 GB) and are recorded, with the
# numbers, in documentation/research/local-route.md. Each main-stage model's
# `baseline` names its benchmark file under $ATR_DATA_DIR/local-inference/bench/.
# One slot (--parallel 1): the MVP runs one trial at a time (D-058), and a second
# slot would split the context and the memory.

[server]
image = "ghcr.io/ggml-org/llama.cpp:server-cuda-b12063@sha256:d5ffba7d096ab0236c65dc147d797b4b7658a7e5425634593373635d661bccda"
build = "b12063"
commit = "2cbca389f515df455412dafa07e2b1359cc72a6d"
cuda = "12.8.1"
# Environment variable through which the server reads its API key.
api_key_env = "LLAMA_API_KEY"
# Flags for every model; each model adds its own.
args = [
    "--flash-attn", "on",
    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",
    "--parallel", "1",
    "--metrics",
    "--offline",
    # The web UI is not used; /slots is enabled explicitly because check L1 and
    # `serve record` read it (it returns prompt text, which the copy drops).
    "--no-webui",
    "--slots",
]

# L-MoE. Thinking, precise coding: the model card's sampling. 34 layers of experts
# stay on the CPU: with 36 the 128k context left 1.9 GB of VRAM free after loading,
# with 32 the full 128k prompt peaked at 7972 of 8192 MiB, and 34 peaked at
# 7565 MiB (about 0.6 GB free) and ran the 128k prompt at 342 tokens/s.
[models."qwen3.6-35b-a3b-ud-q3_k_xl"]
alias = "qwen3.6-35b-a3b"
role = "L-MoE"
stage = "main"
repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
revision = "a483e9e6cbd595906af30beda3187c2663a1118c"
file = "Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf"
size = 16845511648
sha256 = "a832b9689925f1bd335bbe985cdfb06c36bf2cf268f4f8f6eceafa3ceb515617"
context = 131072
baseline = "qwen3.6-35b-a3b-ud-q3_k_xl-20261104T204406Z.json"
args = [
    "--n-gpu-layers", "999",
    "--n-cpu-moe", "34",
    # Prompt-cache RAM in MiB: the container peaked at 13.4 GiB of the VM's 17.6 GiB,
    # leaving about 4 GiB for this cache, the task container and the other containers
    # (the default of 8192 does not fit). Check L5 revisits it.
    "--cache-ram", "2048",
    "--temp", "0.6", "--top-p", "0.95", "--top-k", "20", "--min-p", "0", "--presence-penalty", "0",
    "--chat-template-kwargs", '{"enable_thinking":true}',
]

# L-MoE if RAM runs short.
[models."qwen3.6-35b-a3b-ud-iq3_xxs"]
alias = "qwen3.6-35b-a3b"
role = "L-MoE"
