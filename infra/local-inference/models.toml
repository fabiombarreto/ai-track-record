# Open-weight models and the inference server of the local models plan
# (documentation/plans/local-models.md, D-057, D-058).
#
# Every weight file is pinned by repository revision and SHA-256, and the server
# image by digest. From harness/, in WSL:
#   uv run python -m atr.local.fetch            download and verify the main stage
#   uv run python -m atr.local.serve start <id> start the server with one model
#   uv run python -m atr.local.bench            measure its speeds and power
#   uv run python -m atr.local.serve stop
# Weights live outside the repository, in $ATR_MODELS_DIR (default /mnt/d/atr/models).
# The flags start from the model cards and are tuned in WP0.

[server]
image = "ghcr.io/ggml-org/llama.cpp:server-cuda-b12063@sha256:d5ffba7d096ab0236c65dc147d797b4b7658a7e5425634593373635d661bccda"
build = "b12063"
commit = "2cbca389f515df455412dafa07e2b1359cc72a6d"
cuda = "12.8.1"
# Environment variable through which the server reads its API key.
api_key_env = "LLAMA_API_KEY"
# Flags for every model; each model adds its own.
args = [
    "--flash-attn", "on",
    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",
    "--parallel", "1",
    "--metrics",
    "--offline",
]

# L-MoE. Thinking, precise coding: the model card's sampling.
[models."qwen3.6-35b-a3b-ud-q3_k_xl"]
alias = "qwen3.6-35b-a3b"
role = "L-MoE"
stage = "main"
repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
revision = "a483e9e6cbd595906af30beda3187c2663a1118c"
file = "Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf"
size = 16845511648
sha256 = "a832b9689925f1bd335bbe985cdfb06c36bf2cf268f4f8f6eceafa3ceb515617"
context = 131072
args = [
    "--n-gpu-layers", "999",
    "--n-cpu-moe", "36",
    "--temp", "0.6", "--top-p", "0.95", "--top-k", "20", "--min-p", "0", "--presence-penalty", "0",
    "--chat-template-kwargs", '{"enable_thinking":true}',
]

