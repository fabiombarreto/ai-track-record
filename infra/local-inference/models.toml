sha256 = "9c964e657212fea1f24905dd7b0a89b82fd807d19fab0b41da14251b07b88fbe"
context = 131072
args = [
    "--n-gpu-layers", "999",
    "--n-cpu-moe", "34",
    # Prompt-cache RAM in MiB: same budget as the main L-MoE entry (a smaller file
